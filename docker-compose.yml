version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # No public port binding - backend is internal only.
    # Frontend Nginx container reaches it via http://backend:5001 on the Docker network.
    # Exposing port 5001 publicly would allow TLS connections from the browser to hit
    # plain HTTP Uvicorn directly, causing "Invalid HTTP request received" warnings.
    expose:
      - "5001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini}
      - VAD_MODE=${VAD_MODE:-2}
      - VAD_HANGOVER_FRAMES=${VAD_HANGOVER_FRAMES:-30}
      - HOST=0.0.0.0
      - PORT=5001
    env_file:
      - backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped
